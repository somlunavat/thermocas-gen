# Stage 2: training. Device is chosen from config so the same code runs on
# mps, cpu and cuda without edits.

seed: 20261019

device:
  accelerator: auto        # auto | mps | cpu | cuda
  # fp16 autocast is unsupported on mps; bf16-mixed on cuda, 32 on mps/cpu.
  # resolve_precision() in thermocas/model/device.py picks per accelerator.
  precision: auto

data:
  labeled_fasta: data/processed/cas9_labeled.fasta
  label_table: data/processed/label_table.csv
  splits_dir: data/splits
  # Tokens, not residues: 1,700 residues plus BOS, control token and EOS.
  max_length: 1703
  # Sequences longer than max_length are dropped and counted, never silently
  # discarded. The prior repo's silent drop is the bug this guards against.
  on_too_long: drop_and_report   # drop_and_report | truncate
  # auto resolves per accelerator: 0 on mps, where worker processes hang
  # rather than run slowly, and up to 8 on cuda, where 0 leaves the GPU
  # waiting on a single tokenizing process. See resolve_num_workers.
  num_workers: auto

optim:
  lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]
  scheduler: cosine_with_warmup
  warmup_steps: 200
  # 20,000 steps x batch 1 x accumulate 16 = 320,000 sequences, which is 1.14
  # epochs over the 279,980-sequence stage A training split (17,499 steps per
  # epoch). About 9-10 h on an A10.
  #
  # This number is a starting budget, not a claim that 1.14 epochs is enough.
  # Nothing here establishes how long a single control token takes to become
  # load-bearing through 4.5M LoRA parameters on a frozen backbone, and the
  # one run that got anywhere died at step 2,149 with the learning rate still
  # near its peak -- too early to read. So the run is instrumented instead of
  # the budget being guessed upward: the conditioning probe below reports the
  # gain every 2,500 steps, and `train --resume` continues from the last
  # checkpoint. If the curve is still rising at step 20,000 the run gets
  # extended on evidence; if it is flat from 2,500 onward, more steps are not
  # the missing ingredient and a longer budget would only have cost more to
  # learn the same thing.
  max_steps: 20000
  grad_clip: 1.0

batch:
  size: 1                  # a 1,536-token Cas9 is large; scale on the GPU
  accumulate_grad_batches: 16
  val_size: 2
  # Gate 2 and the held-out test report are forward-only, so they hold no
  # activations for a backward pass and fit a larger batch than training.
  # Six passes over a 17,000-sequence split at val_size 2 is hours; this is
  # the same arithmetic with fewer kernel launches. Padding rises with the
  # batch, which costs time and not correctness: the loss is masked per token.
  #
  # 8, measured. 32 and 16 both went OOM on a 24 GB A10 once gradient
  # checkpointing was turned off for the evaluation passes.
  #
  # The estimate that said 32 would fit reasoned from the logits, which are
  # negligible here -- ProGen2's vocabulary is 35 tokens, where a normal LM's
  # logits are what caps the batch. The ceiling is actually the MLP
  # intermediate at 4x hidden: 32 x 1,027 x 6,144 in fp32 is 807 MB per
  # tensor and the GELU holds several at once.
  eval_size: 8

loss:
  # Weight on the auxiliary OGT regression head, if model.yaml enables it.
  ogt_head_weight: 0.1

# Validation cadence. This is not a tuning knob; it is load-bearing.
#
# A stage A epoch is ~18,400 optimizer steps, and training is bounded by
# max_steps rather than by epochs, so with Lightning's default (validate once
# per epoch) validation can run nearly never. ModelCheckpoint then monitors a
# metric that does not exist -- and it does not raise. It silently saves
# nothing: verified on a tiny model, where save_top_k=3 with monitor=val_loss
# produced one unmonitored `last.ckpt` and a best score of None. A 20,000-step
# run would have ended with no best checkpoint and no error.
#
# check_interval_batches counts TRAINING BATCHES, not optimizer steps. With
# accumulate_grad_batches=16, 8,000 batches is 500 optimizer steps, which is
# deliberately equal to checkpoint/every_n_steps; 11_train.py refuses to start
# if the two disagree.
validation:
  check_interval_batches: 8000
  # Bounded so a validation pass costs minutes rather than hours: 200 batches
  # at val_size 2 is 400 sequences. The real Gate 2 evaluation uses the whole
  # validation split and is separate from this.
  limit_batches: 200

checkpoint:
  dir: checkpoints
  every_n_steps: 500
  save_top_k: 3
  monitor: val_loss
  mode: min

# Gate 2. Validation perplexity with the correct growth-temperature token must
# beat perplexity with a shuffled token by this margin, or the run stops and
# nothing is generated.
conditioning_gate:
  enabled: true
  n_shuffles: 5
  fail_on_violation: true

  # Two criteria, replacing a single invented threshold.
  #
  # This was `min_perplexity_gain: 0.02` -- a 2% relative gain, asserted and
  # never checked against the corpus. It is unreachable here. The mutual
  # information between residue identity and growth-temperature bin bounds
  # what any model can gain from the token at 0.172%, so the gate sat 12x
  # above its own ceiling and the first run to finish was reported as a
  # failure while capturing ~1.5x the first-order signal available.
  #
  # Effect size is a property of the corpus, not of the model, so thresholding
  # it against a constant was the error. Ask instead:

  # 1. Is the effect real? Margin over the shuffled mean, in units of the
  #    spread across shuffle draws. Both arms score the same sequences, so
  #    sequence-sampling error cancels and a real effect gives a large z --
  #    the 2026-10-26 run scored 80. 3.0 is a conventional floor, not a
  #    measured one, but it is a floor on a quantity that has a null.
  min_z: 3.0

  # 2. Is the effect large given what is available? From
  #    scripts/13_conditioning_ceiling.py on the stage A corpus: I = 0.001720
  #    nats within-cluster, a best-possible gain of +0.172%. Recompute this
  #    when the corpus changes -- it is a different number for the Cas9 stage,
  #    where orthologs across temperature classes are a far tighter comparison
  #    than whole proteomes.
  ceiling_gain: 0.00172
  # Which corpus that number came from. 11_train.py refuses to start if it
  # disagrees with the stage being trained, because a ceiling measured on one
  # corpus gives a confident and meaningless answer about another, and nothing
  # downstream would notice. The Cas9 ceiling is not yet measured -- the
  # corpus does not exist yet -- so stage B will stop here until it is.
  ceiling_corpus: pretrain
  # A language model has context and can exceed a unigram ceiling, so values
  # above 1.0 are legitimate; 0.5 asks for half the first-order signal.
  min_ceiling_fraction: 0.5
  # The same measurement, taken during training on a fixed subsample, so a
  # failed gate comes with a curve rather than a single number. Flat from the
  # first probe to the last says the conditioning is not being learned at all;
  # rising but short of 2% says the run was too short. Those are different
  # findings and the end-of-run gate alone cannot tell them apart.
  # 1,000 examples x 6 passes is a few minutes against the hour the full
  # 15,055-sequence split costs.
  probe_examples: 500
  probe_every_n_steps: 2500
  # A cap on the final gate and the test report, in examples per split. 0
  # means the whole split, which is the honest default and what this should
  # stay at unless the arithmetic below says otherwise.
  #
  # This is a budget knob, not the smoke-check --gate2-limit flag, and the two
  # print different things: a capped gate is a deliberate subsample of a
  # stated size, and a smoke check is not a gate at all. Scoring is
  # n_shuffles + 1 passes per split, so the full val + test evaluation is
  # (15,055 + 16,952) x 6 = 192,042 sequence scorings, and at the measured
  # rate that is hours. Sampling noise is not the reason to cap it -- at
  # 5,000 sequences the perplexity estimate is already far tighter than the
  # 2% threshold -- GPU budget is.
  #
  # Set to 5,000 for the first full run. Measured evaluation rate is 7.8
  # sequences/s on an A10, which is roughly the card's fp32 roofline for this
  # model and not a bug: the passes are deliberately fp32 (see
  # evaluate_perplexity) and gradient checkpointing is already off. 5,000 per
  # split costs ~2.1 h of the ~12.7 h run instead of the ~6.8 h the full
  # splits would cost.
  #
  # The available 4-8x is bf16, which this declines. The argument that bf16
  # would be safe -- that per-token rounding noise averages out over ~1.5M
  # tokens, and that the correct-token and shuffled-token passes see nearly
  # identical inputs so their systematic error largely cancels in the
  # difference -- is plausible and untested. Before taking it, score one
  # checkpoint in both precisions on the same subsample and check the gains
  # agree to well inside the effect size. Not worth doing on the way to a
  # first result.
  max_examples: 5000

logging:
  backend: csv             # csv | wandb
  project: thermocas-gen
  log_every_n_steps: 25
