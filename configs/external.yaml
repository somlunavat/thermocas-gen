# External validation corpus for the conditioning ceiling.
#
# WHY THIS EXISTS. The ceiling sweep (results/ceiling_sweep_20261027) showed
# that measured conditioning gain follows the corpus-only ceiling across
# threshold choices -- on ONE corpus, ours, built by our own species-balancing
# and per-species-capping design. "A cheap corpus statistic predicts which
# label definition conditions better" is a claim about corpora in general, and
# with n=1 the alternative explanation is that the curve is a property of how
# we built stage A. This corpus is the second observation.
#
# THIS BECAME TRAINING DATA ON 2026-11-01, and the warning that used to stand
# here -- never train on this, it has had no Cas9 screen -- is why the screen
# below exists. It is now screened at the same thresholds as every other
# trainable corpus and split cluster-disjoint, so stage A may read it.
#
# WHAT IT IS FOR. Every corpus trained on before today was assembled by our own
# species-balancing and per-species cap, and their measured optima came out at
# 50 and 65 C -- both close to the middle of the temperature range, which is
# where the `-abs(edge - 55)` baseline of paper/draft.md section 5.1c points
# for free. That baseline has not yet been put at risk. This corpus is the one
# that can do it: with no cap and no balancing, its ceiling peaks at 35 C
# because Swiss-Prot piles up at 37, so the corpus statistic and the
# fixed-centre baseline disagree about which threshold is best. See
# results/ceiling_sweep_20261030/external_measured.md for why the
# design-matched corpus could not settle this.
#
# WHAT IS INDEPENDENT, AND WHAT IS NOT. Independent: the sequence set
# (UniProtKB reviewed bacteria and archaea in full, no species selection and
# no per-species cap, against our curated-and-capped sample of Gosha-selected
# species), the label resolution (77 distinct temperatures against 47), and
# the organism set. Not independent: both OGT tables scrape overlapping
# culture-collection catalogues, so agreement is evidence about corpora, not
# about growth-temperature measurement. See thermocas/data/engqvist.py.

seed: 20261028

paths:
  # Engqvist, BMC Microbiology 18:177 (2018). Zenodo 10.5281/zenodo.1175609,
  # CC BY 4.0. One row per organism: organism, domain, temperature, taxid.
  ogt_source: data/raw/engqvist/temperature_data.tsv
  # UniProtKB/Swiss-Prot, the whole reviewed release file, read through gzip.
  # Eukaryotic entries drop out of the join because the Engqvist table is
  # loaded prokaryotes-only, so the subset never has to be requested.
  sequences: data/raw/external/uniprot_sprot.fasta.gz
  labeled_fasta: data/processed/external_proteins.fasta
  # What stage A reads. A config without this key falls back to the unscreened
  # file above, which is the one failure here that passes every downstream gate
  # while invalidating the stage B leakage result.
  screened_sequences: data/processed/external_proteins_screened.fasta
  label_table: data/processed/external_label_table.csv
  clusters: data/processed/external_clusters.tsv
  splits_dir: data/splits/external

# What --download fetches. Reviewed (Swiss-Prot) only: curation is what makes
# this a different slice from stage A's, which takes unreviewed entries too
# because reviewed coverage outside model organisms is thin. The release
# number goes in PROJECT_LOG.md, which is why the date file is fetched beside
# the sequences.
download:
  url: https://ftp.uniprot.org/pub/databases/uniprot/current_release/knowledgebase/complete/uniprot_sprot.fasta.gz
  release_file: https://ftp.uniprot.org/pub/databases/uniprot/current_release/knowledgebase/complete/reldate.txt

# Matched to configs/pretrain.yaml's `sampling` bounds so that sequence-level
# filtering is not a difference between the two corpora. The comparison is
# supposed to be about label definition and species composition; letting the
# length window differ as well would confound it.
filter:
  min_length: 60
  max_length: 1024
  allowed_residues: ACDEFGHIKLMNPQRSTVWY
  drop_exact_duplicates: true

# The sweep recomputes these for every variant; the values here only set the
# `temp_bin` column written into the label table, and are the project
# convention so that the external table is readable alongside the stage A one.
growth_temperature:
  bins:
    - {name: meso,   min: -.inf, max: 45}
    - {name: thermo, min: 45,    max: .inf}
  min_per_bin: 200
  require_crosscheck: false   # Engqvist ships no per-collection columns

ogt:
  min_plausible_c: -20.0
  max_plausible_c: 130.0

# No cap and no balancing: this is the corpus as the databases have it. The
# capped-and-balanced counterpart is configs/external_balanced.yaml, and the
# difference between the two sweeps is what isolates our selection design from
# the corpus itself.
sampling:
  max_proteins_per_species: 0   # 0 = no cap
  balance: none

# Same clustering parameters as stage A, so the within-cluster column of the
# two sweeps is computed over comparable groupings.
cluster:
  tool: mmseqs2
  min_seq_id: 0.50
  coverage: 0.80
  cov_mode: 0
  cluster_mode: 0

# Alignment screen against the held-out Cas9 sequences, identical to
# configs/external_balanced.yaml and stricter than the stage B leakage gate
# (30% over 50% coverage against 45% over 80%), for the reason
# 09_screen_broad.py gives: a large corpus hides a borderline homolog far more
# easily than a 1,019-sequence one.
exclude_cas9:
  enabled: true
  name_patterns: [cas9, csn1, csx12, "crispr-associated endonuclease"]
  pfam_profiles: [PF22702, PF18541, PF13395, PF01844, PF16592, PF16593, PF16595, PF21069, PF22385]
  max_identity_to_heldout: 0.30
  alignment_coverage: 0.50
  fail_on_violation: true

# Stage A gate. The cluster floor is pretrain.yaml's and is the one that bears
# on whether the token can carry signal. The sequence floor is lowered from
# 20,000 to 10,000 because this corpus is uncapped rather than sampled: at a
# 60 C threshold its hot bin holds 14,481 sequences, which is what Swiss-Prot
# has above 60 C and not a deficiency of our sampling. Lowering a gate to let a
# planned run through is exactly the move that gates exist to prevent, so the
# reason is recorded here and in PROJECT_LOG.md rather than left to the diff.
gate:
  min_clusters_per_bin: 200
  min_sequences_per_bin: 10000

# Splitting, cluster-disjoint, matching configs/external_balanced.yaml.
split:
  fractions: {train: 0.90, val: 0.05, test: 0.05}
  holdout_subfamily: null
  holdout_positive_controls: false
  positive_controls: []
