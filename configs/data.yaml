# Stage 1: homolog collection, labeling, clustering and splitting.
# Every threshold the pipeline uses lives here. Scripts read this file and
# never carry their own defaults.

seed: 20261019

paths:
  seeds: data/raw/seeds.fasta
  hits: data/processed/hits.tsv
  labeled_fasta: data/processed/cas9_labeled.fasta
  label_table: data/processed/label_table.csv
  splits_dir: data/splits
  ogt_source: data/raw/gosha.csv            # set by 04_join_ogt.py --ogt-csv
  ogt_crosscheck: data/raw/ogt_crosscheck.csv  # TEMPURA / BacDive / Engqvist

# Homolog search. Protein query against protein database (blastp-style);
# never blastx, since seeds and database are both protein.
search:
  tool: diamond                 # diamond | mmseqs2
  database: uniref50            # recorded in PROJECT_LOG.md with version + date
  max_evalue: 1.0e-5
  min_query_coverage: 0.70      # fraction of the query aligned
  max_target_seqs: 5000
  sensitivity: very-sensitive   # diamond preset
  threads: 8

# Length and composition filter. Most Cas9 orthologs span roughly 1,000-1,400
# aa, but the range is wider than the brief's estimate at both ends: CjCas9 is
# 984 aa and FnCas9 (type II-B) is 1,629 aa, both verified reviewed UniProt
# entries. The bounds below admit every reference seed; anything outside is a
# fragment or a fusion.
filter:
  min_length: 950
  max_length: 1700
  allowed_residues: ACDEFGHIKLMNPQRSTVWY   # reject X, B, Z, U, O and gaps
  drop_exact_duplicates: true

# Catalytic domain confirmation. A sequence must carry both nuclease domains
# to count as a Cas9 rather than a distant RuvC-only relative.
#
# Each requirement lists alternative Pfam profiles and is satisfied when ANY
# of them hits below hmm_evalue. Accessions and profile versions were verified
# against the InterPro API and then checked by running hmmsearch against the
# eight reference seeds on 2026-10-20; see PROJECT_LOG.md for the per-seed
# results.
#
# PF22702 (Cas9_RuvC) is the Cas9-specific RuvC model and is the one that
# matters: the generic PF18541 (RuvC_III) misses St1Cas9 completely, so
# requiring PF18541 alone would reject a canonical type II-A Cas9. PF18541 is
# kept as a weaker alternative because it hits some orthologs more strongly
# than PF22702 does.
#
# Known coverage gap: FnCas9 (type II-B, Csx12-like) matches no Pfam RuvC
# model at all, so divergent type II-B orthologs are under-recovered by this
# filter. This is a scope limitation to report, not something to paper over by
# accepting a non-RuvC domain as RuvC evidence.
domains:
  require: [RuvC, HNH]
  hmm_evalue: 1.0e-3
  # hmmsearch orientation: profiles are the query, sequences are the target,
  # and the per-domain i-Evalue (domtblout column 13) is the value compared.
  hmm_profiles:
    RuvC:
      - PF22702   # Cas9_RuvC, Cas9 RuvC domain          (profile PF22702.3)
      - PF18541   # RuvC_III, RuvC endonuclease subdomain 3 (PF18541.8)
    HNH:
      - PF13395   # HNH_4, HNH endonuclease              (PF13395.13)
      - PF01844   # HNH, HNH endonuclease                (PF01844.30)
  # Recorded for the evaluation stage's architecture and PAM-interacting
  # domain checks. Not required for a sequence to be kept here.
  informational_profiles:
    Cas9_PI:
      - PF16595   # PAM-interacting domain of Cas9       (PF16595.11)
    Cas9_REC:
      - PF16592   # REC lobe of Cas9                     (PF16592.11)
    Cas9_BH:
      - PF16593   # Bridge helix of Cas9                 (PF16593.12)
    Cas9_typeIIB:
      - PF21069   # Csx12, Cas9 alpha-helical lobe       (PF21069.3)
      - PF22385   # Cas9_C_2, Cas9 C-terminal domain     (PF22385.1)
  profile_dir: data/raw/pfam

# Growth-temperature binning. These are the control-token classes, not
# decoding settings. Edges are in degrees Celsius, upper-exclusive.
#
# TWO bins, not three. The brief proposed meso / thermo / hyper, but Gosha
# holds only 171 cross-checked hyperthermophilic species and 484 thermophilic
# ones, and the Cas9-labeled corpus can only be a subset of those. A separate
# `hyper` class could not have reached min_per_bin, so Gate 1 would have failed
# on an arbitrary threshold rather than on anything about the science. Merging
# the two thermophilic classes keeps the contrast the thesis actually needs --
# mesophilic versus thermophilic -- with enough data behind each side.
#
# The information lost by merging is recovered two ways: `ogt_c` stays in the
# label table as a continuous value, and model.yaml enables an auxiliary head
# that regresses on it. Conditioning is coarse; the target is not.
growth_temperature:
  bins:
    - {name: meso,   min: -.inf, max: 45}
    - {name: thermo, min: 45,    max: .inf}
  min_per_bin: 200          # Gate 1 fails below this in any bin
  require_crosscheck: false # true restricts training to ogt_verified rows

# OGT labels from the Gosha database (bioRxiv 2021.12.21.473645), distributed
# as CSV on figshare (DOI 10.6084/m9.figshare.23257940, CC BY 4.0). The
# all-species file carries a consensus column plus one column per source
# culture collection, so the cross-check the brief wanted a second database
# for can be done within Gosha itself.
ogt:
  # Physically implausible values are present and must be bounded away. Gosha
  # lists Bacillus haloalkaliphilus at 230 C and Halomonas aerodenitrificans
  # at 187 C, each from a single collection; nothing grows above ~122 C.
  min_plausible_c: -20.0
  max_plausible_c: 130.0

  # Cross-check within Gosha. Scrape errors inflate temperature, so they land
  # in the thermophilic classes specifically: Streptococcus massilliensis is
  # listed at 96 C by one collection alone, which would label a mesophile a
  # hyperthermophile. Two independent collections are required, and they must
  # agree on the BIN rather than on absolute degrees -- spread grows with
  # temperature, and Pyrococcus furiosus spans 20 C across five collections
  # while being beyond doubt a hyperthermophile.
  crosscheck:
    min_sources: 2
    min_bin_agreement: 0.67

# Cluster-level splitting. Splitting by sequence would leak near-duplicate
# homologs across splits; splitting by cluster is what makes the test set mean
# anything.
cluster:
  tool: mmseqs2
  min_seq_id: 0.45          # 40-50% per the brief
  coverage: 0.80
  cov_mode: 0
  cluster_mode: 0

split:
  fractions: {train: 0.80, val: 0.10, test: 0.10}
  # A whole subfamily is held out so the test set measures generalization to
  # unseen Cas9 types, not interpolation within known ones.
  holdout_subfamily: II-C
  # Natural thermophilic Cas9s kept out of training to serve as positive
  # controls at evaluation time.
  holdout_positive_controls: true
  positive_controls: [GeoCas9, ThermoCas9]

# Leakage gate. 06_leakage_test.py exits non-zero if any test sequence is this
# similar to any training sequence. Training must not start until it passes.
leakage:
  max_identity_to_train: 0.45
  alignment_coverage: 0.80
  fail_on_violation: true
