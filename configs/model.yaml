# Model definitions. `active` selects which one train.py builds.

active: conditioned_lm

# Primary model: pretrained autoregressive protein LM, LoRA-adapted, with a
# discrete growth-temperature token prepended to each sequence.
conditioned_lm:
  kind: pretrained_lm
  # progen2-BASE, not -small and not -large. Checked against the published
  # configs on 2026-10-20: progen2-small and progen2-large both declare
  # n_positions=1024, which does not fit SpCas9 (1,368 aa), let alone FnCas9
  # (1,629 aa). progen2-base declares n_positions=2048 and does. The size
  # ordering is counter-intuitive -- base has the longest context of the three
  # -- so this is easy to get wrong, and getting it wrong reproduces the prior
  # repository's central bug with a different number.
  checkpoint: hugohrban/progen2-base   # 765M params, n_positions=2048
  # filter.max_length is 1,700 residues, plus BOS, the growth-temperature
  # control token and EOS. train.py asserts the checkpoint provides at least
  # this and refuses to start otherwise.
  required_context: 1703
  use_growth_temp_token: true
  # Fraction of examples whose growth-temperature token is replaced by the
  # unconditional token, enabling classifier-free-guidance-style strengthening
  # at generation time.
  growth_temp_token_dropout: 0.10
  # Auxiliary regression head predicting OGT in degrees Celsius from the
  # pooled representation. Two jobs: it doubles as an in-model scorer, and it
  # carries the resolution lost when the hyper bin was merged into thermo.
  # Conditioning is a two-way token; the regression target is continuous, so
  # a 95 C host and a 50 C host remain distinguishable to the model. Keep this
  # enabled while the bins stay coarse.
  ogt_head:
    enabled: true
    hidden: 256
    dropout: 0.1
  lora:
    enabled: true
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: [qkv_proj, out_proj]

# Ablation: identical to the above with conditioning removed. Any claim that
# the growth-temperature label matters is measured against this.
unconditioned_lm:
  kind: pretrained_lm
  # Must match conditioned_lm exactly apart from the conditioning, or the
  # ablation measures the checkpoint rather than the temperature token.
  checkpoint: hugohrban/progen2-base
  required_context: 1703
  use_growth_temp_token: false
  growth_temp_token_dropout: 0.0
  ogt_head:
    enabled: false
  lora:
    enabled: true
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: [qkv_proj, out_proj]

# From-scratch baseline, rewritten from the prior repository's masked LM.
# Rotary positions replace learned absolute embeddings so context is not
# capped, and attention goes through scaled_dot_product_attention so a
# 1,536-token sequence does not materialize a dense L x L matrix.
# Labeled a weak baseline on purpose; it is not expected to be competitive.
scratch_transformer:
  kind: scratch_mlm
  d_model: 256
  n_heads: 8
  n_layers: 6
  ffn_mult: 4
  dropout: 0.1
  max_length: 1792          # covers 1,700 residues plus special tokens
  position: rotary           # rotary | alibi
  rope_theta: 10000.0
  norm: pre                  # pre-norm; the prior repo's post-norm was less stable
  mask_prob: 0.15
  use_growth_temp_token: true
  growth_temp_token_dropout: 0.10

# Simplest possible baseline: predict OGT from amino-acid composition alone.
# If this matches the language model, the language model is not earning its
# complexity.
composition_baseline:
  kind: composition
  features: [aa_frequency, charge_fraction, ivywrel]
  estimator: ridge
  alpha: 1.0
