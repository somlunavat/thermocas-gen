[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thermocas"
version = "0.1.0"
description = "Temperature-conditioned protein language modeling for Cas9-family sequences"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["thermocas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
